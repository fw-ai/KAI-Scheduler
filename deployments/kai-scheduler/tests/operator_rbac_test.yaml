suite: Supplemental operator webhook permissions
templates:
- rbac/operator.yaml
- rbac/operator-additional-webhooks.yaml
tests:
- it: creates no supplemental permissions by default
  asserts:
  - template: rbac/operator-additional-webhooks.yaml
    hasDocuments:
      count: 0
- it: grants only the configured webhook names and scoped verbs
  set:
    operator.additionalWebhookConfigurationNames:
    - custom-mutating
    - custom-validating
  asserts:
  - template: rbac/operator-additional-webhooks.yaml
    hasDocuments:
      count: 2
  - template: rbac/operator-additional-webhooks.yaml
    documentIndex: 0
    equal:
      path: kind
      value: ClusterRole
  - template: rbac/operator-additional-webhooks.yaml
    documentIndex: 0
    equal:
      path: metadata.name
      value: kai-operator-additional-webhooks
  - template: rbac/operator-additional-webhooks.yaml
    documentIndex: 0
    equal:
      path: rules
      value:
      - apiGroups:
        - admissionregistration.k8s.io
        resources:
        - mutatingwebhookconfigurations
        - validatingwebhookconfigurations
        resourceNames:
        - custom-mutating
        - custom-validating
        verbs:
        - delete
        - patch
        - update
  - template: rbac/operator-additional-webhooks.yaml
    documentIndex: 1
    equal:
      path: kind
      value: ClusterRoleBinding
  - template: rbac/operator-additional-webhooks.yaml
    documentIndex: 1
    equal:
      path: roleRef
      value:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kai-operator-additional-webhooks
- it: binds the supplemental role to the operator in the release namespace
  release:
    namespace: custom-kai
  set:
    operator.additionalWebhookConfigurationNames:
    - custom-mutating
  asserts:
  - template: rbac/operator-additional-webhooks.yaml
    documentIndex: 1
    equal:
      path: subjects
      value:
      - kind: ServiceAccount
        name: kai-operator
        namespace: custom-kai
- it: deduplicates configured webhook names
  set:
    operator.additionalWebhookConfigurationNames:
    - custom-mutating
    - custom-validating
    - custom-mutating
  asserts:
  - template: rbac/operator-additional-webhooks.yaml
    documentIndex: 0
    equal:
      path: rules
      value:
      - apiGroups:
        - admissionregistration.k8s.io
        resources:
        - mutatingwebhookconfigurations
        - validatingwebhookconfigurations
        resourceNames:
        - custom-mutating
        - custom-validating
        verbs:
        - delete
        - patch
        - update
- it: leaves the generated upstream permissions unchanged with custom names
  set:
    operator.additionalWebhookConfigurationNames:
    - custom-mutating
  asserts:
  - template: rbac/operator.yaml
    contains:
      path: rules
      content:
        apiGroups:
        - admissionregistration.k8s.io
        resources:
        - mutatingwebhookconfigurations
        - validatingwebhookconfigurations
        resourceNames:
        - kai-podgroup-validation-v2alpha2
        - kai-queue-validation-v2
        - mutating-kai-admission
        - validating-kai-admission
        verbs:
        - delete
        - patch
        - update
