{{- /* Keep the controller-gen output separate so regeneration preserves the Helm customization. */ -}}
{{- $role := .Files.Get "files/rbac/operator.yaml" | fromYaml -}}
{{- $additionalNames := .Values.operator.additionalWebhookConfigurationNames | default list -}}
{{- range $rule := $role.rules -}}
  {{- if and (has "admissionregistration.k8s.io" $rule.apiGroups) $rule.resourceNames -}}
    {{- $_ := set $rule "resourceNames" (concat $rule.resourceNames $additionalNames | uniq) -}}
  {{- end -}}
{{- end -}}
{{ $role | toYaml | nindent 0 }}
